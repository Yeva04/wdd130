<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Get in touch with us for general inquiries, reservations, and website suggestions. Reach our staff and find directions to our location.">
        <meta name="author" content="Water Rafting">
        
        <title>Contact Us - Whitewater Rafting</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/contact.css"> 
    </head>
<body>
    <header>
        <div class="header-container">
            <img src="images/water_boat.webp" alt="Rafting Logo" class="logo">
            <h1>White Water Rafting</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <main>
        <section>
            <h2>Contact Information</h2>
            <p>📍 123 River Rapids Rd, Raftville, CO 80439</p>
            <p>📞 (123) 456-7890</p>
            <p>📧 contact@whitewaterrafting.com</p>
            <iframe
              src="https://www.google.com/maps/embed?...your_map_link_here..."
              width="600"
              height="450"
              style="border:0;"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
          </section>
          

          <section>
           <h2>Meet Our Team</h2>
            <figure>
              <img src="images/employee1.jpg" alt="Guide Jane" width="200">
              <figcaption>Jane - Adventure Guide</figcaption>
            </figure>
            <figure>
              <img src="images/employee2.jpg" alt="Support Mike" width="200">
              <figcaption>Mike - Customer Support</figcaption>
            </figure>
            <figure>
              <img src="images/employee3.jpg" alt="Agent Sarah" width="200">
              <figcaption>Sarah - Reservation Agent</figcaption>
            </figure>
          </section>
          
          <section>
            <h3>CONTACT US</h3>  
            <div class="form-container">
                <form action="#" method="post">
                  <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                  </div>
              
                  <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                  </div>
              
                  <div class="form-group">
                    <label>Purpose of Message:</label>
                    <label><input type="radio" name="purpose" value="general"> General Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                  </div>
              
                  <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                  </div>
              
                  <div class="form-group">
                    <label><input type="checkbox" name="subscribe"> Please subscribe me to the monthly newsletter</label>
                  </div>
              
                  <div class="form-group">
                    <button type="submit">Submit Form</button>
                  </div>
                </form>
              </div>
              
          </section>
          
       
    </main>
    
    <footer>
        <p>&copy; 2024 White Water Rafting | Favour Ojobor</p>
        <p><a href="images/contact-wireframe.png" target="_blank">View Contact Us Wireframe</a></p>
        
        <div class="social-container">
            <a href="https://facebook.com">
                <img src="images/facebook-icon.webp" alt="Facebook">
            </a>
            <a href="https://twitter.com">
                <img src="images/twitter-icon.webp" alt="Twitter">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-icon.webp" alt="Instagram">
            </a>
        </div>

    </footer>
</body>
</html>
